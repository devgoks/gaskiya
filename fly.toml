# Fly.io config for Gaskiya.
# First deploy:
#   fly launch --no-deploy --copy-config --name gaskiya
#   fly volumes create gaskiya_data --size 1 --region lhr
#   fly secrets set DEEPSEEK_API_KEY=sk-... MSISDN_SALT=$(openssl rand -hex 24) DASHBOARD_TOKEN=$(openssl rand -hex 12)
#   fly deploy
# Then point the Qrios app callback URL at https://gaskiya.fly.dev
app = "gaskiya"
primary_region = "lhr"

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/gaskiya.db"
  DEEPSEEK_MODEL = "deepseek-flash"

[[mounts]]
  source = "gaskiya_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # USSD sessions time out in seconds. A cold start would eat the whole budget,
  # so one machine always stays warm.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
